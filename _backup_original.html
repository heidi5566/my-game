<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極簡塔防 Mini Tower Defense</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#1b2733;
    --accent:#4fd1c5;
    --accent2:#f6ad55;
    --danger:#f56565;
    --text:#e2e8f0;
    --grid:#ffffff;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    display:flex; flex-direction:column; align-items:center;
    padding:16px; width:100%; max-width:720px;
  }
  h1{
    font-size:20px; margin:0 0 4px 0; letter-spacing:1px;
  }
  #sub{
    font-size:12px; color:#8aa0b2; margin-bottom:12px; text-align:center;
  }
  #hud{
    display:flex; gap:16px; margin-bottom:10px; font-size:14px;
    background: var(--panel);
    padding:8px 16px; border-radius:10px;
    width:100%; justify-content:space-around;
    flex-wrap:wrap;
  }
  #hud span b{ color: var(--accent); }
  #hud .lives b{ color: var(--danger); }
  canvas{
    background: var(--grid);
    border-radius:10px;
    max-width:100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    touch-action:none;
    cursor: pointer;
  }
  canvas.placing{
    cursor: crosshair;
  }
  #controls{
    margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  button{
    background: var(--accent);
    color:#0f1720;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
  }
  button.secondary{ background: var(--accent2); }
  button.ghost{ background:#334455; color:var(--text); }
  button:hover{ opacity:0.9; }
  button:disabled{ background:#3a4a58; color:#8aa0b2; cursor:not-allowed; }
  #placeMsg{
    font-size:12px; color:var(--accent2); min-height:16px; margin-top:6px; text-align:center;
  }
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    z-index:10; text-align:center; padding:20px;
  }
  #overlay h2{ font-size:28px; margin-bottom:8px; }
  #overlay p{ color:#a0b4c4; margin-bottom:16px; }
  .hint{ font-size:12px; color:#6b8091; margin-top:8px; text-align:center;}
</style>
</head>
<body>
<div id="wrap">
  <h1>🏰 極簡塔防</h1>
  <div id="sub">敵人是會爆炸的炸彈兵，沿路徑前進。砲塔會自動旋轉瞄準並開火，血量歸零即引爆！</div>
  <div id="hud">
    <span>波次 <b id="waveDisplay">1</b></span>
    <span>金幣 <b id="goldDisplay">50</b></span>
    <span class="lives">生命 <b id="livesDisplay">10</b></span>
    <span>擊殺 <b id="killDisplay">0</b></span>
  </div>
  <canvas id="game" width="640" height="420"></canvas>
  <div id="placeMsg"></div>
  <div id="controls">
    <button id="startWaveBtn">開始波次</button>
    <button id="placeTowerBtn" class="secondary">放置新砲塔 (40金)</button>
    <button id="upgradeBtn">升級選中砲塔 (20金)</button>
    <button id="restartBtn">重新開始</button>
    <button id="soundBtn" class="ghost">🔊 音效開</button>
  </div>
  <div class="hint">最多可部署 3 座砲塔（含初始塔）；點擊場上砲塔可選中它（黃圈標示），選中後可升級；點擊「放置新砲塔」再點空地即可自選位置增設</div>
</div>

<div id="overlay">
  <h2 id="overTitle">遊戲結束</h2>
  <p id="overText">你的基地被攻破了！</p>
  <button id="overRestart">再玩一次</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ================= 路徑 (凹字型) =================
  const path = [
    {x:-20, y:60},
    {x:150, y:60},
    {x:150, y:220},
    {x:400, y:220},
    {x:400, y:80},
    {x:660, y:80}
  ];
  const PATH_CLEARANCE = 34;

  function distToSegment(px,py, ax,ay, bx,by){
    const dx = bx-ax, dy = by-ay;
    const lenSq = dx*dx+dy*dy;
    let t = lenSq === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t*dx, cy = ay + t*dy;
    return Math.hypot(px-cx, py-cy);
  }
  function distToPath(px,py){
    let min = Infinity;
    for(let i=0;i<path.length-1;i++){
      const d = distToSegment(px,py, path[i].x,path[i].y, path[i+1].x,path[i+1].y);
      if(d < min) min = d;
    }
    return min;
  }
  function normalizeAngle(a){
    while(a > Math.PI) a -= Math.PI*2;
    while(a < -Math.PI) a += Math.PI*2;
    return a;
  }

  // ================= 音效 (原生 Web Audio API，無外部檔案) =================
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playShoot(){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(920, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime+0.06);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.08);
  }
  function playExplosion(){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    const dur = 0.35;
    const bufferSize = Math.floor(audioCtx.sampleRate*dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 2);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime+dur);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
  }
  function playPlace(){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(300, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(600, audioCtx.currentTime+0.15);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.18);
  }

  // ================= 砲塔 =================
  const MAX_TOWERS = 3;
  const NEW_TOWER_COST = 40;
  const NEW_TOWER_MIN_GAP = 55;

  function makeTower(x,y){
    return {
      x, y,
      range: 130,
      damage: 12,
      fireRate: 550,
      lastShot: 0,
      level: 1,
      angle: -Math.PI/2
    };
  }

  // 初始塔固定在「凹」字型缺口內、偏右側
  let towers = [ makeTower(350, 150) ];
  let selectedTower = towers[0];
  let placingMode = false;

  let enemies = [];
  let bullets = [];
  let particles = [];

  let gold = 50;
  let lives = 10;
  let wave = 1;
  let kills = 0;
  let waveActive = false;
  let spawnQueue = 0;
  let spawnTimer = 0;
  let gameOver = false;
  let lastTime = 0;

  const waveDisplay = document.getElementById('waveDisplay');
  const goldDisplay = document.getElementById('goldDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const killDisplay = document.getElementById('killDisplay');
  const startWaveBtn = document.getElementById('startWaveBtn');
  const placeTowerBtn = document.getElementById('placeTowerBtn');
  const upgradeBtn = document.getElementById('upgradeBtn');
  const restartBtn = document.getElementById('restartBtn');
  const soundBtn = document.getElementById('soundBtn');
  const placeMsg = document.getElementById('placeMsg');
  const overlay = document.getElementById('overlay');
  const overTitle = document.getElementById('overTitle');
  const overText = document.getElementById('overText');
  const overRestart = document.getElementById('overRestart');

  function updateHUD(){
    waveDisplay.textContent = wave;
    goldDisplay.textContent = gold;
    livesDisplay.textContent = lives;
    killDisplay.textContent = kills;
    upgradeBtn.disabled = !selectedTower || gold < 20;
    placeTowerBtn.disabled = gold < NEW_TOWER_COST || towers.length >= MAX_TOWERS;
    placeTowerBtn.textContent = towers.length >= MAX_TOWERS
      ? `砲塔已達上限 (${MAX_TOWERS})`
      : `放置新砲塔 (${NEW_TOWER_COST}金)`;
  }

  function spawnEnemy(){
    const baseHp = 30 + (wave-1)*12;
    enemies.push({
      x: path[0].x, y: path[0].y,
      hp: baseHp, maxHp: baseHp,
      speed: 45 + (wave-1)*3,
      seg: 0,
      reward: 5 + Math.floor(wave/2),
      phase: Math.random()*Math.PI*2
    });
  }

  function startWave(){
    ensureAudio();
    if(waveActive || gameOver) return;
    waveActive = true;
    spawnQueue = 5 + wave * 2;
    spawnTimer = 0;
    startWaveBtn.disabled = true;
  }

  function pointDist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }

  function moveEnemy(e, dt){
    const target = path[e.seg+1];
    if(!target){
      lives -= 1;
      e.dead = true;
      if(lives <= 0) endGame(false);
      return;
    }
    const dx = target.x - e.x;
    const dy = target.y - e.y;
    const dist = Math.hypot(dx,dy);
    const step = e.speed * dt;
    if(step >= dist){
      e.x = target.x; e.y = target.y;
      e.seg += 1;
    } else {
      e.x += dx/dist*step;
      e.y += dy/dist*step;
    }
  }

  function fireBullet(from, target, damage){
    bullets.push({ x: from.x, y: from.y, target, speed: 340, damage });
    playShoot();
  }

  function spawnExplosion(x,y){
    particles.push({type:'shock', x, y, life:0.4, maxLife:0.4});
    const n = 12;
    for(let i=0;i<n;i++){
      const angle = (Math.PI*2/n)*i + Math.random()*0.3;
      const speed = 70 + Math.random()*90;
      particles.push({
        type:'spark', x, y,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
        life: 0.45+Math.random()*0.15, maxLife: 0.6
      });
    }
    playExplosion();
  }

  function updateTowers(dt, now){
    for(const t of towers){
      let best = null, bestSeg = -1;
      for(const e of enemies){
        if(e.dead) continue;
        const d = pointDist(e.x,e.y,t.x,t.y);
        if(d <= t.range && e.seg > bestSeg){
          bestSeg = e.seg;
          best = e;
        }
      }
      if(best){
        const desired = Math.atan2(best.y - t.y, best.x - t.x);
        t.angle += normalizeAngle(desired - t.angle) * Math.min(1, dt*8);
        if(now - t.lastShot >= t.fireRate){
          t.lastShot = now;
          fireBullet(t, best, t.damage);
        }
      } else {
        t.angle += dt*0.4; // 待機緩慢掃視
      }
    }
  }

  function updateBullets(dt){
    for(const b of bullets){
      if(b.dead) continue;
      if(!b.target || b.target.dead || b.target.hp <= 0){
        b.dead = true;
        continue;
      }
      const dx = b.target.x - b.x;
      const dy = b.target.y - b.y;
      const dist = Math.hypot(dx,dy);
      const step = b.speed*dt;
      if(step >= dist){
        b.target.hp -= b.damage;
        b.dead = true;
        if(b.target.hp > 0){
          particles.push({type:'hit', x:b.target.x, y:b.target.y, life:0.15, maxLife:0.15});
        } else if(!b.target.dead){
          b.target.dead = true;
          gold += b.target.reward;
          kills += 1;
          spawnExplosion(b.target.x, b.target.y);
        }
      } else {
        b.x += dx/dist*step;
        b.y += dy/dist*step;
      }
    }
    bullets = bullets.filter(b=>!b.dead);
  }

  function updateParticles(dt){
    for(const p of particles){
      p.life -= dt;
      if(p.type === 'spark'){
        p.x += p.vx*dt;
        p.y += p.vy*dt;
        p.vx *= 0.92;
        p.vy *= 0.92;
      }
    }
    particles = particles.filter(p=>p.life>0);
  }

  function checkWaveEnd(){
    if(waveActive && spawnQueue <= 0 && enemies.every(e=>e.dead)){
      waveActive = false;
      enemies = [];
      wave += 1;
      gold += 15;
      startWaveBtn.disabled = false;
    }
  }

  function endGame(win){
    gameOver = true;
    overlay.style.display = 'flex';
    overTitle.textContent = win ? '🎉 勝利！' : '💥 遊戲結束';
    overText.textContent = win ? '你成功守住了所有波次！' : `你撐到了第 ${wave} 波，共擊殺 ${kills} 隻敵人。`;
  }

  // ================= 繪圖 =================
  function drawPath(){
    ctx.strokeStyle = '#2d3b4a';
    ctx.lineWidth = 36;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.stroke();

    ctx.strokeStyle = '#3d4f61';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function hexPath(r){
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = Math.PI/3*i - Math.PI/6;
      const x = r*Math.cos(a), y = r*Math.sin(a);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  function drawLevelBadge(cx, topY, level, highlight){
    ctx.font = 'bold 11px sans-serif';
    const text = 'Lv ' + level;
    const tw = ctx.measureText(text).width;
    const pad = 6;
    const bw = tw + pad*2, bh = 16;
    const bx = cx - bw/2, by = topY - bh;
    ctx.beginPath();
    const r = 4;
    ctx.moveTo(bx+r, by);
    ctx.arcTo(bx+bw, by, bx+bw, by+bh, r);
    ctx.arcTo(bx+bw, by+bh, bx, by+bh, r);
    ctx.arcTo(bx, by+bh, bx, by, r);
    ctx.arcTo(bx, by, bx+bw, by, r);
    ctx.closePath();
    ctx.fillStyle = highlight ? '#f6ad55' : '#20303d';
    ctx.fill();
    ctx.strokeStyle = highlight ? '#f6ad55' : '#4fd1c5';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = highlight ? '#1a1206' : '#e2e8f0';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, by+bh/2+0.5);
  }

  function drawTowers(){
    for(const t of towers){
      const baseR = 19 + t.level*1.8;
      const turretR = 9 + t.level*1.3;
      const barrelLen = 20 + t.level*2.2;
      const isSel = (t === selectedTower);

      // 射程範圍
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(79, 209, 197, 0.07)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(79, 209, 197, 0.25)';
      ctx.stroke();

      ctx.save();
      ctx.translate(t.x, t.y);

      // 選中光環
      if(isSel){
        ctx.beginPath();
        ctx.arc(0, 0, baseR+7, 0, Math.PI*2);
        ctx.strokeStyle = '#f6ad55';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // 塔座 (六角形底座)
      const grad = ctx.createRadialGradient(0,0,2,0,0,baseR);
      grad.addColorStop(0, '#3a4f5e');
      grad.addColorStop(1, '#1c2833');
      hexPath(baseR);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#0f1720';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 砲管 (依角度旋轉指向目標)
      ctx.save();
      ctx.rotate(t.angle);
      ctx.fillStyle = '#0f1720';
      ctx.fillRect(0, -4, barrelLen, 8);
      ctx.fillStyle = '#334a5a';
      ctx.fillRect(0, -2, barrelLen, 4);
      ctx.restore();

      // 砲塔頂部圓盤 (turret)
      const turretGrad = ctx.createRadialGradient(-3,-3,1,0,0,turretR);
      turretGrad.addColorStop(0, '#8fe9df');
      turretGrad.addColorStop(1, '#2a9d93');
      ctx.beginPath();
      ctx.arc(0, 0, turretR, 0, Math.PI*2);
      ctx.fillStyle = turretGrad;
      ctx.fill();
      ctx.strokeStyle = '#12332f';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();

      // 等級標籤 (置於塔上方，取代原本圈內文字)
      drawLevelBadge(t.x, t.y - baseR - 6, t.level, isSel);
    }
  }

  function drawEnemies(now){
    for(const e of enemies){
      if(e.dead) continue;
      const r = 12;
      ctx.save();
      ctx.translate(e.x, e.y);

      // 炸彈本體
      const bodyGrad = ctx.createRadialGradient(-4,-4,1, 0,0, r);
      bodyGrad.addColorStop(0, '#5a5a5a');
      bodyGrad.addColorStop(0.6, '#2b2b2b');
      bodyGrad.addColorStop(1, '#131313');
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI*2);
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 高光
      ctx.beginPath();
      ctx.arc(-4,-4, 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();

      // 引信
      ctx.strokeStyle = '#8a5a2b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(4, -r-8, 2, -r-12);
      ctx.stroke();

      // 火花 (閃爍)
      const flick = 0.6 + 0.4*Math.sin(now/70 + e.phase*10);
      ctx.beginPath();
      ctx.arc(2, -r-12, 2.5*flick+1.5, 0, Math.PI*2);
      ctx.fillStyle = flick > 0.8 ? '#fff6c8' : '#f6ad55';
      ctx.fill();

      ctx.restore();

      // 血條
      const w = 26;
      ctx.fillStyle = '#33161a';
      ctx.fillRect(e.x-w/2, e.y-r-22, w, 4);
      ctx.fillStyle = '#68d391';
      ctx.fillRect(e.x-w/2, e.y-r-22, w*(e.hp/e.maxHp), 4);
    }
  }

  function drawBullets(){
    for(const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
      ctx.fillStyle = '#e08e2c';
      ctx.fill();
      ctx.strokeStyle = '#8a5a12';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawParticles(){
    for(const p of particles){
      const t = p.life / p.maxLife;
      if(p.type === 'shock'){
        const radius = (1-t)*46 + 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,180,90,${t*0.8})`;
        ctx.lineWidth = 3;
        ctx.stroke();
      } else if(p.type === 'spark'){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3*t+1, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,${120+Math.floor(t*100)},60,${t})`;
        ctx.fill();
      } else { // 'hit'
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8*t+2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(224,142,44,${t})`;
        ctx.fill();
      }
    }
  }

  function drawPlacementPreview(mx,my){
    if(!placingMode || mx===null) return;
    const valid = isValidPlacement(mx,my);
    ctx.beginPath();
    hexPathAt(mx,my,19);
    ctx.fillStyle = valid ? 'rgba(79,209,197,0.5)' : 'rgba(245,101,101,0.5)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mx, my, 130, 0, Math.PI*2);
    ctx.strokeStyle = valid ? 'rgba(79,209,197,0.4)' : 'rgba(245,101,101,0.4)';
    ctx.stroke();
  }
  function hexPathAt(cx,cy,r){
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = Math.PI/3*i - Math.PI/6;
      const x = cx+r*Math.cos(a), y = cy+r*Math.sin(a);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  function render(now){
    ctx.clearRect(0,0,W,H);
    drawPath();
    drawTowers();
    drawBullets();
    drawEnemies(now);
    drawParticles();
    drawPlacementPreview(lastMouse.x, lastMouse.y);
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;

    if(!gameOver){
      if(waveActive){
        spawnTimer -= dt;
        if(spawnTimer <= 0 && spawnQueue > 0){
          spawnEnemy();
          spawnQueue -= 1;
          spawnTimer = 0.7;
        }
      }
      for(const e of enemies){
        if(!e.dead) moveEnemy(e, dt);
      }
      updateTowers(dt, now);
      updateBullets(dt);
      updateParticles(dt);
      checkWaveEnd();
      updateHUD();
    }
    render(now);
    requestAnimationFrame(loop);
  }

  // ================= 放置新砲塔 =================
  function isValidPlacement(x,y){
    if(x < 26 || x > W-26 || y < 26 || y > H-26) return false;
    if(distToPath(x,y) < PATH_CLEARANCE) return false;
    for(const t of towers){
      if(pointDist(x,y,t.x,t.y) < NEW_TOWER_MIN_GAP) return false;
    }
    return true;
  }

  let lastMouse = {x:null, y:null};

  function getCanvasPos(evt){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  canvas.addEventListener('mousemove', (evt)=>{ lastMouse = getCanvasPos(evt); });
  canvas.addEventListener('mouseleave', ()=>{ lastMouse = {x:null,y:null}; });

  canvas.addEventListener('click', (evt)=>{
    ensureAudio();
    if(gameOver) return;
    const pos = getCanvasPos(evt);

    if(placingMode){
      if(gold < NEW_TOWER_COST){
        placeMsg.textContent = '金幣不足，無法放置砲塔';
        return;
      }
      if(!isValidPlacement(pos.x, pos.y)){
        placeMsg.textContent = '此位置太靠近路徑或其他砲塔，請換個地方';
        return;
      }
      gold -= NEW_TOWER_COST;
      const t = makeTower(pos.x, pos.y);
      towers.push(t);
      selectedTower = t;
      placingMode = false;
      canvas.classList.remove('placing');
      placeMsg.textContent = '新砲塔已成功部署！';
      playPlace();
      setTimeout(()=>{ placeMsg.textContent=''; }, 1800);
      updateHUD();
      return;
    }

    let clicked = null;
    for(const t of towers){
      const r = 19 + t.level*1.8 + 5;
      if(pointDist(pos.x,pos.y,t.x,t.y) <= r){ clicked = t; break; }
    }
    if(clicked){ selectedTower = clicked; updateHUD(); }
  });

  placeTowerBtn.addEventListener('click', ()=>{
    ensureAudio();
    if(gold < NEW_TOWER_COST || towers.length >= MAX_TOWERS) return;
    placingMode = !placingMode;
    canvas.classList.toggle('placing', placingMode);
    placeMsg.textContent = placingMode ? '請點擊畫面空地放置新砲塔（不可太靠近路徑）' : '';
  });

  startWaveBtn.addEventListener('click', startWave);
  upgradeBtn.addEventListener('click', ()=>{
    ensureAudio();
    if(selectedTower && gold >= 20){
      gold -= 20;
      selectedTower.level += 1;
      selectedTower.damage += 8;
      selectedTower.range += 12;
      selectedTower.fireRate = Math.max(150, selectedTower.fireRate - 40);
      updateHUD();
    }
  });

  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 音效開' : '🔇 音效關';
    if(soundOn) ensureAudio();
  });

  function resetGame(){
    enemies = []; bullets = []; particles = [];
    gold = 50; lives = 10; wave = 1; kills = 0;
    waveActive = false; spawnQueue = 0; spawnTimer = 0; gameOver = false;
    towers = [ makeTower(350,150) ];
    selectedTower = towers[0];
    placingMode = false;
    canvas.classList.remove('placing');
    placeMsg.textContent = '';
    startWaveBtn.disabled = false;
    overlay.style.display = 'none';
    updateHUD();
  }

  restartBtn.addEventListener('click', resetGame);
  overRestart.addEventListener('click', resetGame);

  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
